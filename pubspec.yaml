name: quran_circle_report
description: تطبيق تقارير حلقات القرآن الكريم
publish_to: 'none'
version: 1.10.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^13.3.0
  path_provider: ^2.1.3
  equatable: ^2.0.5
  uuid: ^4.4.0
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  hijri: ^3.0.0
  syncfusion_flutter_pdf: ^28.1.33
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.1.2
  flutter_colorpicker: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/certificate_templates/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: Mirza
      fonts:
        - asset: assets/fonts/Mirza-Regular.ttf
          weight: 400
    - family: Katibeh
      fonts:
        - asset: assets/fonts/Katibeh-Regular.ttf
          weight: 400
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
          weight: 400